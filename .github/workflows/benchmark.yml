name: Benchmark

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # Run the regression suite against the 1.13.3 baseline and against this
    # pull request on the same runner, and fail if any benchmark is more than
    # 1.3 times slower. Shared runners are noisy, hence the wide margin; the
    # same comparison on a quiet machine uses 1.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Compare with release-1.13
        run: |
          set -o pipefail
          julia benchmark/compare.jl rev:release-1.13 path:. 1.3 2 | tee -a "$GITHUB_STEP_SUMMARY"
